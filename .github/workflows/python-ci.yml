name: Python Quality Check

on:
  pull_request:
    branches: ["main"] # Runs when a PR is opened against main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest # The robot's OS
    steps:
      - uses: actions/checkout@v4 # Clones your code onto the robot
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # If you have a requirements file, install it:
          # pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          # Fails the build if there are critical syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
